  metrics: 'Villafañe 2013 (60 pts aged 70–90): reduced pain vs sham · Magni 2022 (8 RCTs): pain SMD 0.53 (0.03 to 1), pinch SMD 0.35 (0.03 to 0.7) (statistically but not clinically significant)'
