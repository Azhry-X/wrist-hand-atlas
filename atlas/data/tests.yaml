  video_title: 'Physiotutors: MC / Midcarpal Test | Wrist Instability'
  summary: Palmar translation, axial load, and ulnar deviation of the pronated wrist to reproduce the catch-up clunk of palmar midcarpal instability.
  steps:
  - Support the patient's forearm in pronation with the wrist in neutral.
  - Apply a palmarly directed shear force to the distal capitate/hand with axial load while moving the wrist from radial into ulnar deviation.
