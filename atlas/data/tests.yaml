- id: crps-gmi-mirror-exposure
  title: CRPS Rehabilitation — Graded Motor Imagery, Mirror Therapy & Exposure in Vivo
  page: 6
  type: info
  review_status: approved
  evidence: M
  summary: Evidence for Graded Motor Imagery (GMI) and mirror therapy (Moseley 2004, Méndez-Rebolledo 2017) and graded exposure in vivo for pain-related fear in CRPS-I (den Hollander 2016).
  steps:
  - 'Deliver Graded Motor Imagery (left/right hand laterality recognition, imagined movements, and mirror therapy): effective in chronic CRPS1 (Moseley 2004, 13 pts) and improves pain and function in CRPS 1 across a systematic review of 6 trials (171 pts, Méndez-Rebolledo 2017).'
  - In CRPS-I patients with pain-related fear (den Hollander 2016 RCT, n = 46), graded exposure in vivo is more effective than pain-contingent care for reducing disability.
  positive: GMI and mirror therapy improve pain and function in CRPS 1 (Moseley 2004; Méndez-Rebolledo 2017); exposure in vivo reduces disability more than pain-contingent care in patients with pain-related fear (den Hollander 2016).
  interpretation: 'Moseley 2004: GMI RCT in chronic CRPS1 (13 pts) effective. Méndez-Rebolledo 2017: SR of 6 trials (171 pts) GMI / mirror therapy improve pain and function in CRPS 1. den Hollander 2016 (RCT, n = 46): graded exposure more effective than pain-contingent care for disability in patients with pain-related fear.'
  metrics: 'GMI RCT (Moseley 2004, 13 pts): effective in chronic CRPS1 · GMI / mirror therapy SR (Méndez-Rebolledo 2017, 6 trials, 171 pts): improves pain and function · Exposure in vivo (den Hollander 2016, n = 46): more effective than pain-contingent care for disability'
