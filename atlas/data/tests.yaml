- id: hand-oedema-mobilisation
  title: Hand Oedema — Manual Oedema Mobilisation (MEM) & Manual Lymph Drainage
  page: 7
  type: info
  review_status: approved
  evidence: L
  summary: Systematic review evidence for manual oedema mobilisation (Miller 2017) and manual lymph drainage after distal radius fracture (Gutiérrez-Espinoza 2022).
  steps:
  - Combine manual oedema mobilisation (proximal-to-distal lymphatic pathway clearing, light skin-traction massage, pump-point stimulation, and active exercise) with standard hand therapy for subacute/problematic hand oedema (Miller 2017).
  - After distal radius fracture, manual lymph drainage reduced hand oedema (e.g. −17.96 ml at 17–21 days, Gutiérrez-Espinoza 2022).
  positive: Low-to-moderate evidence supports manual oedema mobilisation with standard therapy for problematic hand oedema (Miller 2017); MLD reduced oedema by −17.96 ml at 17–21 days post-DRF (Gutiérrez-Espinoza 2022).
  interpretation: 'Miller 2017 (SR, 10 studies): low-to-moderate evidence supports manual oedema mobilisation with standard therapy for problematic hand oedema. Gutiérrez-Espinoza 2022: manual lymph drainage reduced oedema (e.g. −17.96 ml at 17–21 days).'
  metrics: 'Miller 2017 (10 studies): low-to-moderate evidence supports MEM + standard therapy · Gutiérrez-Espinoza 2022: MLD oedema −17.96 ml at 17–21 days'
  sources:
