- id: suspected-scaphoid-fracture
  title: Suspected Scaphoid Fracture — Clinical Rule & Advanced Imaging
  page: 1
  type: info
  review_status: approved
  evidence: M
  summary: 'Clinical decision pathway for suspected scaphoid fracture after wrist trauma: epidemiology, clinical examination, 5-item decision rule (not externally validated), and advanced imaging accuracy.'
  steps:
  - 'Assess clinical signs after wrist trauma: sex, anatomical snuffbox swelling, anatomical snuffbox tenderness, painful ulnar deviation, and painful axial thumb compression (Mallee 2020 5-item clinical decision rule; not externally validated).'
  - In clinical examination, only the absence of snuffbox tenderness helps rule out fracture (LR− 0.15); single signs are inadequate alone and combining tests improves post-test probability.
  - 'When initial radiographs are non-diagnostic and clinical suspicion remains, refer for advanced imaging: MRI is superior to bone scan, CT or ultrasound; if MRI is unavailable, CT is adequate to rule in but not to rule out.'
  positive: Absence of anatomical snuffbox tenderness reduces probability (LR− 0.15, Carpenter 2014). Mallee 2020 5-item rule (sex, snuffbox swelling, snuffbox tenderness, painful ulnar deviation, painful axial thumb compression) has internal validation Sn 97%, Sp 20% (not externally validated).
  interpretation: 'Carpenter 2014 (SR/MA, 75 studies): scaphoid = 70% of carpal fractures; occult fracture prevalence 12% to 57%, point estimate 25% pretest probability with non-diagnostic X-ray; only the absence of snuffbox tenderness helps (LR− 0.15); other findings ''lack accuracy to rule in or rule out''; MRI superior to bone scan, CT or US; if MRI unavailable, CT adequate to rule in but not to rule out. Mallee 2014 (SR/MA, 13 studies): snuffbox tenderness the most sensitive test; low specificity -> many overtreated; combining tests improved post-test probability. Parvizi 1998: pain on thumb movement Sn 69%, Sp 66%; signs inadequate alone, should be combined. Mallee 2020 (n = 893, 7.6% fractures): 5-item rule internal validation Sn 97%, Sp 20%; 15% fewer unnecessary immobilisations and imaging, 50% lower risk of missing a fracture vs current practice (not externally validated). Bäcker 2020 (SR, 42 studies, 2,507 pts): X-ray + exam may miss up to 16%; 21.8% missed on X-ray and found on advanced imaging; MRI Sn 94.2%, Sp 97.7%; CT 81.5%, 96.0%; ultrasound 81.5%, 77.4%. Mallee 2015 (Cochrane DTA, 11 studies): CT Sn 0.72 (0.36–0.92), Sp 0.99 (0.71–1.00); MRI 0.88 (0.64–0.97), 1.00 (0.38–1.00); bone scan 0.99 (0.69–1.00), 0.86 (0.73–0.94); median true-fracture prevalence 20%.'
  metrics: 'Absence of snuffbox tenderness LR− 0.15 (Carpenter 2014) · Mallee 2020 rule Sn 97%, Sp 20% (not externally validated) · Bäcker 2020: MRI Sn 94.2%, Sp 97.7%; CT 81.5%, 96.0%; US 81.5%, 77.4% · Mallee 2015 Cochrane: CT Sn 0.72 (0.36–0.92), Sp 0.99 (0.71–1.00); MRI Sn 0.88 (0.64–0.97), Sp 1.00 (0.38–1.00); bone scan Sn 0.99 (0.69–1.00), Sp 0.86 (0.73–0.94)'
  sources:
  - text: Carpenter 2014 Acad Emerg Med
    url: https://doi.org/10.1111/acem.12317
  - text: Mallee 2014 J Hand Surg Am
    url: https://doi.org/10.1016/j.jhsa.2014.06.004
  - text: Parvizi 1998 J Hand Surg Br
    url: https://doi.org/10.1016/s0266-7681(98)80050-8
  - text: Mallee 2020 Arch Orthop Trauma Surg
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC7109163/
    free_full_text: true
  - text: Bäcker 2020 J Wrist Surg
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC7000269/
    free_full_text: true
  - text: Mallee 2015 Cochrane
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC6464799/
    free_full_text: true
- id: anatomical-snuffbox-tenderness
  title: Anatomical Snuffbox Tenderness & Scaphoid Clinical Signs
  page: 1
  type: test
  review_status: approved
  evidence: M
  summary: Palpation of the anatomical snuffbox and combined clinical signs (snuffbox swelling, painful ulnar deviation, painful axial thumb compression, pain on thumb movement) after acute wrist trauma.
  steps:
  - Inspect the anatomical snuffbox for localized swelling.
  - Palpate the floor of the anatomical snuffbox (between EPL dorsally and EPB/APL volarly) with the wrist in slight ulnar deviation.
  - Assess pain on active/passive ulnar deviation, axial compression along the thumb metacarpal, and thumb movement.
  positive: Reproduction of focal tenderness in the anatomical snuffbox or pain with ulnar deviation / axial thumb compression.
  interpretation: 'Carpenter 2014 (SR/MA, 75 studies): only the absence of snuffbox tenderness helps (LR− 0.15); other findings ''lack accuracy to rule in or rule out''. Mallee 2014 (SR/MA, 13 studies): snuffbox tenderness is the most sensitive test; low specificity -> many overtreated; combining tests improved post-test probability. Parvizi 1998: pain on thumb movement Sn 69%, Sp 66%; signs inadequate alone, should be combined. Mallee 2020 (n = 893, 7.6% fractures): 5-item rule (sex, snuffbox swelling, snuffbox tenderness, painful ulnar deviation, painful axial thumb compression) internal validation Sn 97%, Sp 20% (not externally validated).'
  metrics: Absence of snuffbox tenderness LR− 0.15 (Carpenter 2014) · Pain on thumb movement Sn 69%, Sp 66% (Parvizi 1998) · 5-item rule Sn 97%, Sp 20% (Mallee 2020, not externally validated)
  sources:
  - text: Carpenter 2014 Acad Emerg Med
    url: https://doi.org/10.1111/acem.12317
  - text: Mallee 2014 J Hand Surg Am
    url: https://doi.org/10.1016/j.jhsa.2014.06.004
  - text: Parvizi 1998 J Hand Surg Br
    url: https://doi.org/10.1016/s0266-7681(98)80050-8
  - text: Mallee 2020 Arch Orthop Trauma Surg
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC7109163/
    free_full_text: true
- id: acute-cts-after-drf
  title: Acute Carpal Tunnel Syndrome After Distal Radius Fracture
  page: 1
  type: info
  review_status: approved
  evidence: L
  summary: Incidence, presentation, fracture risk profile, and CRPS progression of acute carpal tunnel syndrome following distal radius fracture.
  steps:
  - Monitor patients after distal radius fracture (especially AO type C fractures) for acute median-territory paraesthesia, pain out of proportion, and progressive motor weakness.
  - Recognise that onset occurs at a median of one week (range 1–12 weeks) post-injury.
  - Refer urgently for surgical decompression assessment when acute progressive median nerve compression is suspected.
  positive: New or worsening median nerve sensory loss, pain out of proportion (13.7%), or reduced power (9.8%) after distal radius fracture.
  interpretation: 'Leow 2021 (n = 1,189): 51 (4.3%) developed acute CTS; median onset one week (range 1–12); pain out of proportion in 13.7%, reduced power in 9.8%; 10 of 51 (20%) resolved without intervention; 5 (10%) of the CTS group developed CRPS; type C fractures at higher risk.'
  metrics: Incidence 4.3% (51 of 1,189); median onset 1 week (range 1–12); pain out of proportion 13.7%; reduced power 9.8%; 10 of 51 (20%) resolved without intervention; 5 (10%) developed CRPS (Leow 2021)
  sources:
  - text: Leow 2021 Eur J Orthop Surg Traumatol
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC8233234/
    free_full_text: true
- id: crps-budapest-criteria
  title: CRPS — Budapest Clinical & Research Diagnostic Criteria
  page: 1
  type: test
  review_status: approved
  evidence: M
  summary: Diagnostic criteria for Complex Regional Pain Syndrome (CRPS) evaluating continuing pain disproportionate to any inciting event across sensory, vasomotor, sudomotor/oedema, and motor/trophic categories.
  steps:
  - Confirm continuing pain disproportionate to any inciting trauma or immobilisation.
  - 'Assess patient-reported symptoms and exam signs across four categories: sensory (hyperaesthesia / allodynia), vasomotor (temperature or skin colour asymmetry), sudomotor / oedema (oedema or sweating asymmetry), and motor / trophic (decreased ROM, motor dysfunction, or trophic changes in hair/nails/skin).'
  - Confirm that no other diagnosis better explains the signs and symptoms.
  positive: Disproportionate continuing pain plus required symptom and sign categories without a better alternative explanation.
  interpretation: 'Harden 2010 (113 CRPS vs 47 neuropathic pain): IASP criteria Sn 1.00, Sp 0.41; Budapest clinical criteria Sn 0.99, Sp 0.68; Budapest research criteria Sp 0.79.'
  metrics: IASP criteria Sn 1.00, Sp 0.41 · Budapest clinical criteria Sn 0.99, Sp 0.68 · Budapest research criteria Sp 0.79 (Harden 2010)
  sources:
  - text: Harden 2010 Pain
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC2914601/
    free_full_text: true
- id: pyogenic-flexor-tenosynovitis-kanavel
  title: Pyogenic Flexor Tenosynovitis — Kanavel Signs & Prognostic Factors
  page: 1
  type: test
  review_status: approved
  evidence: L
  summary: Emergency clinical recognition of closed-space flexor tendon sheath infection using the classic Kanavel signs and verified poor-outcome prognostic factors.
  steps:
  - 'Examine the affected digit for the four Kanavel signs: (1) uniform fusiform swelling of the entire digit, (2) flexed resting posture of the digit, (3) exquisite tenderness along the course of the flexor tendon sheath, and (4) severe pain on passive extension of the digit.'
  - 'Screen for poor-outcome prognostic factors (Pang 2007): age > 43 years, diabetes mellitus, peripheral vascular disease or renal failure, subcutaneous purulence, digital ischaemia, and polymicrobial infection.'
  - Arrange immediate same-day surgical referral for drainage and antibiotics.
  positive: Presence of Kanavel signs (fusiform swelling, flexed posture, tenderness along the flexor sheath, pain on passive digital extension) -> immediate surgical emergency.
  interpretation: 'Pang 2007: poor-outcome factors in pyogenic flexor tenosynovitis include age > 43 years; diabetes, peripheral vascular disease or renal failure; subcutaneous purulence; digital ischaemia; and polymicrobial infection. Kanavel signs require same-day surgical referral.'
  metrics: 'Poor-outcome factors: age > 43 years; diabetes, peripheral vascular disease or renal failure; subcutaneous purulence; digital ischaemia; polymicrobial infection (Pang 2007)'
  sources:
  - text: Pang 2007 J Bone Joint Surg Am
    url: https://doi.org/10.2106/jbjs.f.01356
- id: wrist-hand-red-flags-triage
  title: Wrist & Hand Emergency Red Flags (Compartment, Septic, Injection, Fight Bite)
  page: 1
  type: info
  review_status: approved
  evidence: E
  summary: 'Emergency hand and forearm red flags requiring immediate same-day surgical referral: forearm/hand compartment syndrome, septic arthritis, high-pressure injection injury, and clenched-fist fight bite.'
  steps:
  - 'Forearm / hand compartment syndrome: severe pain out of proportion to injury, tense swollen compartment, pain on passive stretch of the digits, paraesthesia or paresis -> immediate surgical fasciotomy referral.'
  - 'Septic arthritis of the wrist or finger joints: acute hot, swollen, erythematous joint with severe restriction of active/passive motion and systemic signs -> urgent joint aspiration and washout.'
  - 'High-pressure injection injury (paint, grease, hydraulic fluid, fuel): benign-appearing pinpoint entry wound concealing rapid deep tissue necrosis and compartment tamponade -> immediate surgical debridement.'
  - 'Fight bite (clenched-fist laceration over the MCP joint capsule): human oral flora inoculated into the joint or extensor mechanism -> immediate surgical washout and antibiotic therapy.'
  positive: Any sign of pyogenic flexor tenosynovitis (Kanavel signs), compartment syndrome, septic arthritis, high-pressure injection injury, fight bite, or acute progressive CTS after fracture.
  interpretation: 'Expert opinion (E): Kanavel signs, compartment syndrome, septic arthritis, high-pressure injection injury, and fight bite require immediate same-day surgical referral.'
  metrics: Expert consensus (E) — immediate same-day surgical referral
  sources: []
- id: cts-epidemiology-prognosis
  title: Carpal Tunnel Syndrome — Prevalence & Natural History
  page: 2
  type: info
  review_status: approved
  evidence: H
  summary: General population prevalence of median-territory symptoms and confirmed carpal tunnel syndrome (Atroshi 1999) and natural course of untreated idiopathic CTS (Padua 1998).
  steps:
  - 'Interpret symptom prevalence against electrophysiological findings: 1 in 5 symptomatic people in the general population have confirmed CTS, while 18.4% of asymptomatic controls show median neuropathy on nerve conduction testing (Atroshi 1999).'
  - 'Factor occupational exposure: blue-collar workers have higher prevalence (3.5%) than white-collar workers (1.7%) (Atroshi 1999).'
  - In untreated CTS, counsel patients that spontaneous improvement occurs in about one-third of mild and moderate cases, whereas extreme cases never improved in natural history follow-up (Padua 1998).
  positive: Clinically + electrophysiologically confirmed CTS prevalence 2.7% (2.1–3.4) in the general population (Atroshi 1999).
  interpretation: 'Atroshi 1999 (general population, n = 2,466): median-territory symptoms 14.4% (13.0–15.8); clinically certain CTS 3.8% (3.1–4.6); electrophysiological median neuropathy 4.9% (4.1–5.8); clinically + electrophysiologically confirmed 2.7% (2.1–3.4); 1 in 5 symptomatic people have CTS; blue-collar 3.5% vs white-collar 1.7%; median neuropathy in 18.4% of asymptomatic controls. Padua 1998 (80 untreated): worsening inversely related to severity; about one-third of mild and moderate cases improved; extreme cases never improved.'
  metrics: 'Prevalence (Atroshi 1999, n = 2,466): symptoms 14.4% (13.0–15.8), clinically certain 3.8% (3.1–4.6), electrophysiological 4.9% (4.1–5.8), combined 2.7% (2.1–3.4); blue-collar 3.5% vs white-collar 1.7%; asymptomatic median neuropathy 18.4% · Untreated course (Padua 1998, n = 80): ~1/3 mild/moderate improved; extreme never improved'
  sources:
  - text: Atroshi 1999 JAMA
    url: https://doi.org/10.1001/jama.282.2.153
  - text: Padua 1998 Ital J Neurol Sci
    url: https://doi.org/10.1007/bf02341782
- id: persistent-wrist-pain-prognosis
  title: Persistent Wrist Pain & Post-DRF Psychological Prognostic Screen
  page: 2
  type: info
  review_status: approved
  evidence: L
  summary: Prognostic trajectory of persistent wrist pain in an arthroscopy cohort (Prosser 2012) and 6-month PRWE cut-off screening for psychological distress after distal radius fracture (Mahdavi 2022).
  steps:
  - In patients with persistent wrist pain, document symptom duration and baseline PRWHE score, which together explain 24% of 1-year PRWHE variance (Prosser 2012).
  - At 6 months after distal radius fracture, check whether PRWE pain or function subscale score is ≥ 18/50 to screen for pain catastrophizing, psychological distress, and fear of movement (Mahdavi 2022).
  positive: PRWE pain or function ≥ 18/50 at 6 months post-DRF screens positive for pain catastrophizing, distress and fear (AUC ≥ 0.88, Mahdavi 2022).
  interpretation: 'Prosser 2012 (arthroscopy cohort): improved on average by approximately 50% at one year, but most had some pain and disability; duration of pain and baseline PRWHE explained 24% of 1-year PRWHE. Mahdavi 2022: PRWE pain or function ≥ 18/50 at 6 months screens for pain catastrophizing, distress and fear (AUC ≥ 0.88).'
  metrics: 'Persistent wrist pain (Prosser 2012): ~50% average improvement at 1 year; duration + baseline PRWHE explain 24% of 1-year PRWHE · Post-DRF screen (Mahdavi 2022): PRWE pain or function ≥ 18/50 at 6 months AUC ≥ 0.88'
  sources:
  - text: Prosser 2012 J Hand Ther
    url: https://doi.org/10.1016/j.jht.2012.03.001
  - text: Mahdavi 2022 Musculoskelet Sci Pract
    url: https://doi.org/10.1016/j.msksp.2021.102474
- id: wrist-hand-differential-pathologies
  title: Wrist & Hand Differential Diagnosis Matrix
  page: 2
  type: info
  review_status: approved
  evidence: E
  summary: 'Pattern recognition across radial, central/dorsal, ulnar, and palmar/neural wrist and hand presentations: CTS, de Quervain tenosynovitis, thumb CMC OA, trigger finger, TFCC / DRUJ injury, scapholunate instability, scaphoid fracture / non-union, DRF, CRPS, and hand OA.'
  steps:
  - 'Palmar / neural: Carpal tunnel syndrome (nocturnal paraesthesia in thumb, index, middle digits; flick sign; Wainner cluster / Katz diagram) vs Guyon''s canal ulnar neuropathy (ring and little digits).'
  - 'Radial wrist / thumb base: De Quervain tenosynovitis (1st dorsal compartment pain over radial styloid; WHAT / Finkelstein / Eichhoff tests) vs Thumb CMC 1 OA (base of thumb pain on pinch/jar opening; grind test) vs Suspected scaphoid fracture / non-union (anatomical snuffbox tenderness after FOOSH).'
  - 'Central / dorsal carpal: Scapholunate instability (dorsal scapholunate interval pain and clunk on Watson scaphoid shift test) vs Midcarpal instability (midcarpal shift clunk).'
  - 'Ulnar wrist: TFCC / ulnar-sided pain (ulnar fovea sign, TFCC compression, ulnar grinding) vs DRUJ instability (painful laxity on DRUJ ballottement) vs Lunotriquetral instability (lunotriquetral ballottement / shuck test).'
  - 'Digits & global hand: Trigger finger (flexor tendon catching/locking at the A1 pulley) · Hand OA (DIP/PIP/CMC nodal stiffness and aching) · CRPS (disproportionate regional pain with sensory, vasomotor, sudomotor/oedema, and motor/trophic changes per Budapest criteria).'
  positive: Matched anatomical pain zone, aggravating load, and provocative cluster.
  interpretation: Combine anatomical localisation with validated clinical rules and tests from the dossier.
  metrics: Expert clinical synthesis (E) combined with condition-specific studies on Pages 1–4
  sources: []
- id: wrist-hand-active-rom
  title: Wrist & Hand Active Range of Motion (AROM)
  page: 3
  type: test
  review_status: approved
  evidence: E
  video_url: https://www.youtube.com/watch?v=kFnDRhcsFdM
  video_title: 'Physiotutors: Active Range of Motion: Wrist & Hand'
  summary: Active range-of-motion assessment of wrist flexion, extension, radial deviation, ulnar deviation, forearm pronation/supination, thumb opposition/abduction/flexion/extension, and digital composite flexion/extension.
  steps:
  - Seat the patient with the forearm supported and the wrist free to move.
  - Assess active wrist flexion, wrist extension, radial deviation, and ulnar deviation bilaterally, noting pain and quality of movement.
  - With the elbow flexed at the side, assess active forearm pronation and supination.
  - Assess active thumb flexion, extension, palmar/radial abduction, opposition to the base of the little finger, and finger MCP/PIP/DIP composite fist and full extension.
  positive: Side-to-side restriction, painful arc, catching/locking, or compensatory movement.
  interpretation: Record active angles bilaterally on the Page 3 write-in table; see the Wrist Goniometry card for goniometer alignment and reliability.
  metrics: 'Expert clinical assessment (E) · Goniometer alignment: see Wrist Goniometry card'
  sources: []
- id: wrist-passive-rom
  title: Wrist Passive Range of Motion (PROM)
  page: 3
  type: test
  review_status: approved
  evidence: E
  video_url: https://www.youtube.com/watch?v=Au2CoKHYAPs
  video_title: 'Physiotutors: Wrist Passive Range of Motion (PROM)'
  summary: Passive range-of-motion and end-feel assessment of the radiocarpal, midcarpal, and distal radioulnar joints in flexion, extension, radial/ulnar deviation, and pronation/supination.
  steps:
  - Stabilise the distal forearm with one hand and move the carpus passively into full wrist flexion and extension, noting end-feel and symptom reproduction.
  - Passively move the wrist into radial deviation and ulnar deviation.
  - Stabilise the distal humerus and passively rotate the distal radius and ulna into full pronation and supination.
  positive: Capsular stiffness, bony block, empty end-feel, or concordant pain reproduction.
  interpretation: Compare passive range against active range to differentiate capsular/articular restriction from tendon or motor deficit.
  metrics: Expert clinical assessment (E)
  sources: []
- id: wrist-hand-resisted-isometric
  title: Wrist & Hand Resisted Isometric Testing
  page: 3
  type: test
  review_status: approved
  evidence: E
  video_url: https://www.youtube.com/watch?v=DKE4QDMlFAs
  video_title: 'Physiotutors: Resisted Isometric Testing (Wrist & Hand)'
  summary: Isometric manual resistance testing of wrist flexors, wrist extensors, radial/ulnar deviators, forearm pronators/supinators, and intrinsic/extrinsic thumb and finger muscles.
  steps:
  - Position the wrist and digits in neutral resting alignment.
  - Apply graded isometric resistance to wrist flexion, extension, radial deviation, and ulnar deviation.
  - Test resisted thumb abduction (APB — median nerve), thumb extension/abduction (EPL/EPB/APL), finger abduction/adduction (interossei — ulnar nerve), and finger flexion.
  positive: Pain reproduction over the contractile unit or myotomal/peripheral nerve weakness.
  interpretation: Compare strength and pain response bilaterally across median, ulnar, and radial innervated muscle groups.
  metrics: Expert clinical assessment (E)
  sources: []
- id: wrist-goniometry
  title: Wrist Goniometry (Volar / Dorsal Alignment)
  page: 3
  type: test
  review_status: approved
  evidence: M
  summary: Standardised goniometric measurement of passive and active wrist flexion and extension comparing radial, ulnar, and dorsal/volar goniometer placement.
  steps:
  - For wrist flexion, place the goniometer along the dorsal aspect of the third metacarpal and dorsal midline of the forearm.
  - For wrist extension, place the goniometer along the volar aspect of the palm/third metacarpal and volar midline of the forearm.
  - Use volar/dorsal alignment consistently across visits, as it yields the highest intra- and inter-tester reliability and least measurement error (LaStayo 1994).
  positive: Volar/dorsal alignment gives the least error and highest within- and between-tester ICCs (LaStayo 1994).
  interpretation: 'LaStayo 1994 (multicentre): flexion ICC within tester .86 / .87 / .92 (radial / ulnar / dorsal alignment), extension .80 / .80 / .84; between testers flexion .88 / .89 / .93; volar/dorsal alignment gives least error.'
  metrics: 'Within-tester ICC: flexion .86 / .87 / .92 (radial / ulnar / dorsal), extension .80 / .80 / .84 · Between-tester ICC: flexion .88 / .89 / .93; volar/dorsal alignment gives least error (LaStayo 1994)'
  sources:
  - text: LaStayo 1994 Phys Ther
    url: https://doi.org/10.1093/ptj/74.2.162
- id: grip-strength-jamar
  title: Grip Strength (Jamar Dynamometer & Limb Symmetry Ratio)
  page: 3
  type: test
  review_status: approved
  evidence: M
  summary: Standardised hand grip dynamometry (kg) and affected-to-unaffected grip ratio (%) with population reference ranges and device non-interchangeability rules.
  steps:
  - Seat the patient with the shoulder adducted, elbow flexed, and forearm and wrist in neutral.
  - Record grip strength (kg) on the affected and unaffected hands using the same dynamometer across all assessments.
  - 'Do not swap devices between visits: GripAble reads 69% of Jamar and devices must not be interchanged (Mutalib 2022). In post-CTR surgery, JOSPT CTS CPG states clinicians ''should not use grip strength when assessing short-term (less than 3 months) change ... following CTR surgery''.'
  positive: Asymmetric grip ratio (%) or deficit relative to age and sex normative tables (Wang 2018).
  interpretation: 'Wang 2018 (Jamar norms): mean grip from 49.7 kg (dominant hand, men 25–29 years) to 18.7 kg (non-dominant, women 75–79 years); use age / sex tables. Mutalib 2022: GripAble vs Jamar ICC 0.906 (0.87–0.94); GripAble reads 69% of Jamar — devices must not be interchanged.'
  metrics: 'Jamar norms (Wang 2018): mean grip 49.7 kg (dominant, men 25–29 years) to 18.7 kg (non-dominant, women 75–79 years) · GripAble vs Jamar (Mutalib 2022): ICC 0.906 (0.87–0.94); GripAble reads 69% of Jamar (do not interchange)'
  calculator:
    kind: formula
    decimals: 1
    value_label: '% Grip Ratio (Affected ÷ Unaffected × 100)'
    expr: '(unaff > 0) ? (aff / unaff * 100) : NaN'
    inputs:
    - heading: Grip Strength Ratio (do not swap devices between visits — Mutalib 2022)
    - key: aff
      label: Affected hand grip strength (kg)
      type: number
    - key: unaff
      label: Unaffected hand grip strength (kg)
      type: number
    outputs:
    - when: v >= 0
      text: 'Grip Ratio: {v|1}% (Affected {aff|1} kg ÷ Unaffected {unaff|1} kg × 100) · Do not swap devices: GripAble vs Jamar ICC 0.906 (0.87–0.94), GripAble reads 69% of Jamar — devices must not be interchanged (Mutalib 2022) · Jamar norms (Wang 2018): mean 49.7 kg (dominant, men 25–29 years) to 18.7 kg (non-dominant, women 75–79 years)'
      tone: good
  sources:
  - text: Wang 2018 JOSPT
    url: https://doi.org/10.2519/jospt.2018.7851
  - text: Mutalib 2022 BMC Musculoskelet Disord
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC8785007/
    free_full_text: true
  - text: Erickson 2019 JOSPT CTS CPG
    url: https://doi.org/10.2519/jospt.2019.0301
- id: pinch-strength-test
  title: Pinch Strength Dynamometry (Lateral / Key, Tip-to-Tip, Tripod)
  page: 3
  type: test
  review_status: approved
  evidence: E
  summary: Pinch gauge assessment of lateral (key) pinch, two-point (tip-to-tip) pinch, and three-jaw chuck (tripod) pinch bilaterally.
  steps:
  - Position the patient seated with the shoulder adducted, elbow flexed, and forearm in neutral.
  - Test lateral (key) pinch between the thumb pulp and lateral aspect of the middle phalanx of the index finger, tip-to-tip pinch between thumb and index tips, and tripod pinch between thumb, index, and middle finger pulps.
  - 'Note: For CTS outcome tracking, JOSPT CTS CPG states clinicians ''should not use lateral pinch strength as an outcome measure'' (Erickson 2019).'
  positive: Pain reproduction at the thumb base (CMC 1) or weakness in median/ulnar intrinsic pinch.
  interpretation: Record affected and unaffected pinch strength values on the Page 3 write-in table. In CTS, JOSPT CTS CPG states clinicians 'should not use lateral pinch strength as an outcome measure' (Erickson 2019).
  metrics: 'Expert clinical assessment (E) · JOSPT CTS CPG (Erickson 2019): ''should not use lateral pinch strength as an outcome measure'''
  sources:
  - text: Erickson 2019 JOSPT CTS CPG
    url: https://doi.org/10.2519/jospt.2019.0301
- id: sensory-two-point-monofilament
  title: Hand Sensory Screen (Median / Ulnar / Radial, 2-Point Discrimination & Monofilament)
  page: 3
  type: test
  review_status: approved
  evidence: M
  summary: Sensory mapping of the palmar thumb/index/middle (median), ring/little (ulnar), and dorsal first web space (radial) using pinprick/hypalgesia, Semmes-Weinstein monofilaments, and static/moving 2-point discrimination.
  steps:
  - Map sensory changes across median (palmar thumb, index, middle, radial half of ring), ulnar (ulnar half of ring and little finger, Guyon's/dorsal ulnar hand), and superficial radial (dorsal first web space) territories.
  - Test for hypalgesia (diminished pinprick sensation) in the palmar aspect of the thumb/index finger compared with the ipsilateral little finger (D'Arcy 2000; Wainner 2005).
  - Assess static 2-point discrimination and Semmes-Weinstein monofilament threshold across digital pulps to document baseline nerve function prior to combined orthotic/stretching care (Erickson 2019).
  positive: Reduced median sensory field of digit 1 or palmar median hypalgesia (LR 3.1, D'Arcy 2000). Abnormal 2-point discrimination is specific but not sensitive for CTS (MacDermid 2004).
  interpretation: 'MacDermid 2004 (SR, 60 studies): 2-point discrimination and APB weakness / atrophy are specific but not sensitive. D''Arcy 2000 (JAMA SR, 12 studies): hypalgesia in median territory LR 3.1 (2.0–5.1); 2-point / vibration / monofilament have little or no value for ruling in or ruling out CTS alone. Wainner 2005 / Erickson 2019 JOSPT CTS CPG include sensory loss in the thumb (digit 1) in the 5-item diagnostic cluster.'
  metrics: Median territory hypalgesia LR 3.1 (2.0–5.1) (D'Arcy 2000) · 2-point discrimination specific but not sensitive (MacDermid 2004)
  sources:
