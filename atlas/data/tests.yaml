- id: prwe
  title: PRWE (Patient-Rated Wrist Evaluation)
  page: 4
  type: info
  review_status: approved
  evidence: M
  summary: 15 items (0–10 per item) evaluating wrist pain (5 pain items, 0–50) and functional disability (10 function items ÷ 2, 0–50) for a total score of 0–100.
  steps:
  - 'Pain subscale (5 pain items, each 0–10): at rest, doing a task with a repeated wrist movement, lifting a heavy object, when it is at its worst, and how often you have pain. Pain = sum of 5 pain items (0–50).'
  - 'Function subscale (10 function items, each 0–10: specific activities + usual activities). Function = sum of 10 function items ÷ 2 (0–50).'
  - Total score = Pain + Function (0–100, higher score = worse pain and disability).
  positive: 'Surgical DRF (Huyke-Hernández 2023): MCID 43.1 (6 weeks) and 56.0 (12 weeks). Post-DRF 6-month psychological screen (Mahdavi 2022): PRWE pain or function ≥ 18/50 screens for pain catastrophizing, distress and fear (AUC ≥ 0.88).'
  interpretation: 'MacDermid 1998: 15 items; test-retest ICC > 0.90. Huyke-Hernández 2023 (surgical DRF): mean 71.8 baseline -> 34.3 at 6 weeks -> 21.2 at 12 weeks; MCID 43.1 (6 weeks) and 56.0 (12 weeks). Mahdavi 2022 (DRF psychological screen): PRWE pain or function ≥ 18/50 at 6 months screens for pain catastrophizing, distress and fear (AUC ≥ 0.88).'
  metrics: 'ICC > 0.90 (MacDermid 1998) · Surgical DRF MCID: 43.1 at 6 weeks, 56.0 at 12 weeks (Huyke-Hernández 2023) · 6-month DRF psychological screen: pain or function ≥ 18/50 (AUC ≥ 0.88, Mahdavi 2022)'
  calculator:
    kind: formula
    decimals: 1
    value_label: / 100 PRWE Total Score (Pain 0–50 + Function 0–50)
    expr: (p1+p2+p3+p4+p5) + (f1+f2+f3+f4+f5+f6+f7+f8+f9+f10)/2
    inputs:
    - heading: Pain Subscale (5 pain items, 0–10 each; sum 0–50)
    - key: p1
      label: 1. Pain at rest
      type: select
      options: &id001
      - - '0'
        - 0 — No pain / no difficulty
      - - '1'
        - 1 — 1
      - - '2'
        - 2 — 2
      - - '3'
        - 3 — 3
      - - '4'
        - 4 — 4
      - - '5'
        - 5 — 5
      - - '6'
        - 6 — 6
      - - '7'
        - 7 — 7
      - - '8'
        - 8 — 8
      - - '9'
        - 9 — 9
      - - '10'
        - 10 — Worst pain / unable to do
    - key: p2
      label: 2. Pain when doing a task with a repeated wrist movement
      type: select
      options: *id001
    - key: p3
      label: 3. Pain when lifting a heavy object
      type: select
      options: *id001
    - key: p4
      label: 4. Pain when it is at its worst
      type: select
      options: *id001
    - key: p5
      label: 5. How often do you have pain? (0 = never, 10 = always)
      type: select
      options: *id001
    - heading: Function Subscale — Specific & Usual Activities (10 function items, 0–10 each; sum ÷ 2 = 0–50)
    - key: f1
      label: 6. Turn a door knob using my affected hand
      type: select
      options: *id001
    - key: f2
      label: 7. Cut meat using a knife in my affected hand
      type: select
      options: *id001
    - key: f3
      label: 8. Fasten buttons on my shirt
      type: select
      options: *id001
    - key: f4
      label: 9. Use my affected hand to push up from a chair
      type: select
      options: *id001
    - key: f5
      label: 10. Carry a 10lb object in my affected hand
      type: select
      options: *id001
    - key: f6
      label: 11. Use bathroom tissue with my affected hand
      type: select
      options: *id001
    - key: f7
      label: 12. Personal care activities (dressing, washing)
      type: select
      options: *id001
    - key: f8
      label: 13. Household work (cleaning, maintenance)
      type: select
      options: *id001
    - key: f9
      label: 14. Work (your job or usual everyday work)
      type: select
      options: *id001
    - key: f10
      label: 15. Recreational activities
      type: select
      options: *id001
    outputs:
