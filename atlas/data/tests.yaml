- id: drf-surgical-fixation-rehab
  title: Distal Radius Fracture — Fixation Trials (WRIST, DRAFFT) & Rehabilitation
  page: 5
  type: info
  review_status: approved
  evidence: H
  summary: Evidence from landmark distal radius fracture fixation trials (WRIST, DRAFFT 1-year and 5-year) and post-fracture rehabilitation trials (Handoll, Kay, Laohaprasitiporn, Gutiérrez-Espinoza).
  steps:
  - POST-OP RESTRICTIONS ARE SURGEON-DIRECTED.
  - 'Fixation trials: WRIST (Chung 2020, ≥ 60 years) showed 12-month MHQ volar plate vs external fixation 3 points (97.5% CL −6.0 to 11.5), vs pinning −0.14 (−9.2 to 8.9); at 6 weeks plate was better than external fixation by 19, pinning by 11, casting by 7 (p = 0.03), with malunion in 48% of casting participants. DRAFFT (Costa 2014, n = 461; Costa 2019 5-year) showed no clinically relevant PRWE difference between K-wires and volar plate at 3, 6, 12 months, or 5 years.'
  - 'Rehabilitation: Handoll 2015 (Cochrane, 26 trials) found ''not enough evidence available to determine the best form of rehabilitation for people with wrist fractures''. Kay 2008 found an advice and exercise program gave ''some additional benefits over no intervention''. Laohaprasitiporn 2022 (n = 48) found no significant differences in function, radiographs or complications between early and delayed motion after volar plate. Gutiérrez-Espinoza 2022 found exercise + MWM vs exercise at 12 weeks improved PRWE −10.2 (p = 0.02) and DASH −9.86 (p = 0.0001), and manual lymph drainage reduced oedema (−17.96 ml at 17–21 days).'
  positive: POST-OP RESTRICTIONS ARE SURGEON-DIRECTED.
  interpretation: 'Chung 2020 (WRIST, ≥ 60 years): 12-month MHQ volar plate vs external fixation 3 points (97.5% CL −6.0 to 11.5), vs pinning −0.14 (−9.2 to 8.9); at 6 weeks plate better than external fixation by 19, pinning by 11, casting by 7 (p = 0.03); malunion in 48% of casting participants. Costa 2014 (DRAFFT, n = 461): no clinically relevant PRWE difference at 3, 6 or 12 months (−1.3, −4.5 to 1.8; P = 0.40); DASH at 12 months −3.2 (−6.5 to 0.0). Costa 2019 (DRAFFT 5-year): PRWE 8.3 (wires) vs 11.3 (plate) (−6.99 to 0.99; p = 0.139) — no clinically relevant difference. Handoll 2015 (Cochrane, 26 trials): ''not enough evidence available to determine the best form of rehabilitation for people with wrist fractures''. Kay 2008: advice and exercise program gave ''some additional benefits over no intervention''. Laohaprasitiporn 2022 (n = 48): early vs delayed motion after volar plate — no significant differences in function, radiographs or complications. Gutiérrez-Espinoza 2022: exercise + MWM vs exercise at 12 weeks PRWE −10.2 (p = 0.02), DASH −9.86 (p = 0.0001); manual lymph drainage reduced oedema (e.g. −17.96 ml at 17–21 days).'
  metrics: 'WRIST (Chung 2020): 6-wk MHQ plate +19 vs ex-fix, +11 vs pinning, +7 vs cast (p = 0.03); cast malunion 48% · DRAFFT (Costa 2014 / 2019): 12-mo PRWE −1.3 (−4.5 to 1.8, P = 0.40); 5-yr PRWE 8.3 vs 11.3 (−6.99 to 0.99, p = 0.139) · Gutiérrez-Espinoza 2022: MWM + exercise PRWE −10.2 (p = 0.02), DASH −9.86 (p = 0.0001); MLD oedema −17.96 ml at 17–21 days'
  sources:
  - text: Chung 2020 Plast Reconstr Surg
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC7255928/
    free_full_text: true
  - text: Costa 2014 BMJ
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC4122170/
