- id: watson-scaphoid-shift-test
  title: Watson Test (Scaphoid Shift Test — Scapholunate Instability)
  page: 4
  type: test
  review_status: approved
  evidence: E
  video_url: https://www.youtube.com/watch?v=xBBUwsVi2-o
  video_title: 'Physiotutors: Watson Test / Scaphoid Shift Test | Scapholunate Instability'
  summary: Dynamic carpal stability test applying volar thumb pressure to the scaphoid tubercle while moving the wrist from ulnar to radial deviation.
  steps:
  - Position the patient's wrist in ulnar deviation and slight extension; place your thumb firmly over the volar scaphoid tubercle and your fingers dorsally over the scapholunate interval.
  - Passively move the wrist from ulnar deviation into radial deviation and slight flexion while maintaining thumb pressure against the scaphoid tubercle (preventing normal scaphoid flexion).
  - Release thumb pressure and feel for a dorsal-to-volar reduction clunk and dorsal scapholunate pain.
  positive: Painful dorsal subluxation of the proximal scaphoid pole over the dorsal rim of the radius that reduces with a palpable clunk when thumb pressure is released.
  interpretation: Always compare with the asymptomatic contralateral wrist to distinguish physiological laxity from symptomatic scapholunate ligament instability.
  metrics: Expert clinical assessment (E)
  sources: []
- id: lunotriquetral-ballottement-test
  title: Lunotriquetral Ballottement Test (Reagan / Shuck Test)
  page: 4
  type: test
  review_status: approved
  evidence: E
  video_url: https://www.youtube.com/watch?v=FU1gIwZF8mE
  video_title: 'Physiotutors: Lunotriquetral Ballottement Test / Shuck Test | Wrist Ligament Instability'
  summary: Dorso-palmar shear translation of the triquetrum-pisiform complex on the stabilised lunate to assess lunotriquetral interosseous ligament integrity.
  steps:
  - Pinch and stabilise the lunate between the thumb and index finger of one hand.
  - Grasp the pisiform and triquetrum with the thumb and index finger of the other hand and translate the triquetrum dorsally and palmarly relative to the lunate.
  positive: Reproduction of ulnar carpal pain, crepitus, or excessive laxity at the lunotriquetral interval compared with the contralateral wrist.
  interpretation: Helps differentiate lunotriquetral ligament injury from TFCC or DRUJ pathology in ulnar-sided wrist pain.
  metrics: Expert clinical assessment (E)
  sources: []
- id: midcarpal-shift-test
