- id: allen-test
  title: Allen Test (Radial & Ulnar Arterial Patency)
  page: 3
  type: test
  review_status: approved
  evidence: E
  video_url: https://www.youtube.com/watch?v=D1tJO0RW9UM
  video_title: 'Physiotutors: Allen Test | Hand Vascularisation'
  summary: Vascular patency assessment of the radial and ulnar arteries and completeness of the superficial/deep palmar arterial arches.
  steps:
  - Instruct the patient to open and close the fist tightly several times, then hold a tight fist to exsanguinate the palm.
  - Compress both the radial and ulnar arteries firmly at the volar wrist.
  - Ask the patient to relax the hand open (palm appears blanched), then release pressure over one artery (e.g., ulnar) while maintaining occlusion of the other, observing palmar flushing. Repeat for the other artery.
  positive: Delayed or absent palmar capillary refill upon releasing either the radial or ulnar artery, indicating arterial insufficiency or incomplete palmar arch collateral flow.
  interpretation: Vascular screen in ulnar-sided wrist pain (hypothenar hammer syndrome), after trauma, or before hand surgery.
  metrics: Expert clinical assessment (E)
