- id: druj-ballottement-test
  title: DRUJ Test (Distal Radioulnar Joint Ballottement / Piano Key)
  page: 4
  type: test
  review_status: approved
  evidence: E
  video_url: https://www.youtube.com/watch?v=nz53aeq-30k
  video_title: 'Physiotutors: Distal Radioulnar Joint Test / DRUJ Test | Radioulnar Wrist Ligament Instability'
  summary: Dorso-palmar shear translation of the distal ulna relative to the stabilised distal radius in neutral, pronation, and supination to assess DRUJ stability.
  steps:
  - Stabilise the distal radius and radiocarpal unit firmly with one hand.
  - Grasp the distal ulnar head with the other hand and translate it dorsally and palmarly in neutral forearm rotation, then repeat in pronation and supination, comparing with the contralateral wrist.
  positive: Excessive dorso-palmar laxity, clunk, or concordant ulnar wrist pain compared with the uninjured side.
  interpretation: Evaluates integrity of the deep foveal radioulnar ligaments of the TFCC and DRUJ capsule.
  metrics: Expert clinical assessment (E)
