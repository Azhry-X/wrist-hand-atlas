  interpretation: 'Merritt 2010: κ 0.48; Sn 42% and 53%, Sp 80% and 93% (two testers); LR+ 2.65 and 6.00; LR− 0.59 and 0.62 — confirms thumb CMC OA when positive, but a negative test does not exclude.'
  metrics: κ 0.48 · Sn 42% and 53%, Sp 80% and 93% (two testers) · LR+ 2.65 and 6.00, LR− 0.59 and 0.62 (Merritt 2010)
  sources:
  - text: Merritt 2010 J Hand Ther
    url: https://doi.org/10.1016/j.jht.2010.02.001
