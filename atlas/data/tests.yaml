  steps:
  - 'Splinting alone (Buhler 2019 SR/MA): no short-term effect, but at 3–12 months reduces pain SMD 0.7 (1.04, 0.35) and improves function SMD 0.42 (0.77, 0.08) (low-quality evidence).'
  - 'Combined multimodal care (Deveza 2021 RCT, n = 204): splint + exercise + topical NSAID + education vs education alone improved FIHOA by −1.7 at 6 weeks and −2.4 (−3.5 to −1.3) at 12 weeks, and reduced pain by −8.6 mm (−15.2 to −2.0).'
  positive: 3–12 month splinting pain SMD 0.7 (1.04, 0.35), function SMD 0.42 (0.77, 0.08) (Buhler 2019); combined care 12-week FIHOA −2.4 (−3.5 to −1.3), pain −8.6 mm (−15.2 to −2.0) (Deveza 2021).
  interpretation: 'Buhler 2019 (SR/MA): 3–12 months: pain SMD 0.7 (1.04, 0.35), function SMD 0.42 (0.77, 0.08); low-quality evidence; no short-term effect. Deveza 2021 (RCT, n = 204): splint + exercise + topical NSAID + education vs education: FIHOA −1.7 at 6 weeks, −2.4 (−3.5 to −1.3) at 12 weeks; pain −8.6 mm (−15.2 to −2.0).'
  metrics: 'Buhler 2019 (3–12 mo): pain SMD 0.7 (1.04, 0.35), function SMD 0.42 (0.77, 0.08) · Deveza 2021 (n = 204): FIHOA −1.7 (6 wk), −2.4 (−3.5 to −1.3, 12 wk); pain −8.6 mm (−15.2 to −2.0)'
  sources:
  - text: Buhler 2019 Osteoarthritis Cartilage
