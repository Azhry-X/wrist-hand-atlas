- id: drf-recovery-rtw-prognosis
  title: Distal Radius Fracture Recovery & Occupational Return-to-Work Cohorts
  page: 8
  type: info
  review_status: approved
  evidence: M
  summary: Recovery trajectory and hardest functional tasks after distal radius fracture (MacDermid 2003) and prognostic determinants of return to work after hand/wrist trauma (Neutel 2019, Bai 2022).
  steps:
  - 'Counsel DRF patients on expected recovery (MacDermid 2003, n = 129): by 3 months median is ''no pain at rest'' and worst pain is 3/10; most recovery occurs within six months; the hardest tasks are carrying ten pounds and pushing up from a chair.'
  - 'Assess return-to-work barriers after hand/wrist trauma (Neutel 2019, n = 383): time off work is linked to job type, diagnosis, complication, blaming someone else, and gender.'
  - 'In occupational upper-limb injury (Bai 2022): 107/163 (65.6%) were back at work at 1 year.'
  positive: 'By 3 months post-DRF: median ''no pain at rest'', worst pain 3/10; most recovery within six months (MacDermid 2003). Occupational upper-limb injury: 107/163 (65.6%) back at work at 1 year (Bai 2022).'
  interpretation: 'MacDermid 2003 (cohort, n = 129): by 3 months median ''no pain at rest'', worst pain 3/10; most recovery within six months; hardest tasks: carrying ten pounds, pushing up from a chair. Neutel 2019 (cohort, n = 383): time off work linked to job type, diagnosis, complication, blaming someone else, gender. Bai 2022 (cohort): 107/163 (65.6%) back at work at 1 year.'
  metrics: 'DRF recovery (MacDermid 2003, n = 129): 3-mo median ''no pain at rest'', worst pain 3/10; most recovery within 6 months · RTW (Neutel 2019, n = 383): linked to job type, diagnosis, complication, blaming someone else, gender · Occupational RTW at 1 yr: 107/163 (65.6%) (Bai 2022)'
