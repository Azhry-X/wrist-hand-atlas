- id: cts-surgical-release-rehab
  title: Carpal Tunnel Release — Surgical Trials & Post-Operative Rehabilitation
  page: 5
  type: info
  review_status: approved
  evidence: H
  summary: Evidence comparing carpal tunnel release against night splinting and non-surgical therapy (Gerritsen 2002, Jarvik 2009) and Cochrane review of post-operative rehabilitation (Peters 2016).
  steps:
  - POST-OP RESTRICTIONS ARE SURGEON-DIRECTED.
  - 'Surgery vs night splint (Gerritsen 2002, n = 176): success at 3 months 80% vs 54% (difference 26%, 12–40%); at 18 months 90% vs 75% (15%, 3–27%).'
  - 'Surgery vs non-surgical therapy without denervation (Jarvik 2009): ''surgery is useful for patients with carpal tunnel syndrome without denervation''.'
  - 'Post-operative rehabilitation (Peters 2016 Cochrane, 22 trials, 1521 pts): limited, low-quality evidence; decision ''should be based on the clinician''s expertise, the patient''s preferences and the context''.'
  positive: POST-OP RESTRICTIONS ARE SURGEON-DIRECTED.
  interpretation: 'Gerritsen 2002 (RCT, n = 176): success at 3 months 80% vs 54% (difference 26%, 12–40%); at 18 months 90% vs 75% (15%, 3–27%). Jarvik 2009 (RCT, no denervation): ''surgery is useful for patients with carpal tunnel syndrome without denervation''. Peters 2016 (Cochrane, 22 trials, 1521 pts): limited, low-quality evidence; decision ''should be based on the clinician''s expertise, the patient''s preferences and the context''.'
  metrics: 'Surgery vs night splint (Gerritsen 2002, n = 176): 3-mo success 80% vs 54% (diff 26%, 12–40%); 18-mo 90% vs 75% (15%, 3–27%) · Rehab after release (Peters 2016, 22 trials, 1521 pts): limited, low-quality evidence'
