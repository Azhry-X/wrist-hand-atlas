- id: froment-sign
  title: Froment Sign (Ulnar Nerve — Adductor Pollicis)
  page: 3
  type: test
  review_status: approved
  evidence: E
  summary: Clinical test for ulnar nerve palsy assessing compensation by the median-innervated flexor pollicis longus (FPL) during forceful key pinch.
  steps:
  - Ask the patient to grasp a flat sheet of paper forcefully between the thumb pulp and radial side of the index finger (key pinch).
  - Attempt to pull the paper away while observing the thumb interphalangeal (IP) joint bilaterally.
  positive: Flexion of the thumb interphalangeal (IP) joint (FPL substitution via the anterior interosseous nerve) on the affected side due to weakness of the ulnar-innervated adductor pollicis.
  interpretation: Indicates motor involvement of the deep motor branch of the ulnar nerve (cubital tunnel or Guyon's canal).
