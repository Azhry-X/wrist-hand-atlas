  evidence: M
  summary: Evidence from Villafañe 2013 RCT and Magni 2022 systematic review/meta-analysis on joint mobilisation and manual therapy for thumb carpometacarpal osteoarthritis.
  steps:
  - 'Villafañe 2013 (RCT, 60 pts aged 70–90): manual therapy + exercise reduced pain vs sham, with limited value for pressure pain threshold, pinch and grip.'
  - 'Magni 2022 (SR/MA, 8 RCTs): thumb CMC mobilisation improved pain SMD 0.53 (0.03 to 1) and pinch SMD 0.35 (0.03 to 0.7) — statistically but not clinically significant.'
  positive: Reduced pain vs sham (Villafañe 2013); pain SMD 0.53 (0.03 to 1) and pinch SMD 0.35 (0.03 to 0.7) — statistically but not clinically significant (Magni 2022).
