      text: 'Pain Subscale: {p1+p2+p3+p4+p5|1} / 50 · Function Subscale: {(f1+f2+f3+f4+f5+f6+f7+f8+f9+f10)/2|1} / 50 · Total Score: {v|1} / 100 · Surgical DRF MCID (Huyke-Hernández 2023): 43.1 (6 weeks) and 56.0 (12 weeks) · DRF 6-month screen (Mahdavi 2022): pain or function ≥ 18/50 screens for pain catastrophizing, distress and fear (AUC ≥ 0.88)'
      tone: good
  sources:
