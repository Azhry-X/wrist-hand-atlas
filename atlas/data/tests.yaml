- id: quickdash
  title: QuickDASH / DASH (Upper Extremity Disability Scale)
  page: 4
  type: info
  review_status: approved
  evidence: M
  summary: 11 items (scored 1–5; at least 10 items answered) transformed via ((sum ÷ n) − 1) × 25 to a 0–100 upper-limb disability score.
  steps:
  - Rate 11 upper-extremity symptom and function items from 1 (no difficulty/none) to 5 (unable/extreme). At least 10 items must be answered.
  - Compute Score = ((sum ÷ n) − 1) × 25 (0–100, higher = greater disability).
  - Compare change against Franchignoni 2014 upper-limb MDC90 and MCID benchmarks.
  positive: Upper-limb change exceeding MDC90 12.85 / MCID 15.91 for QuickDASH, or MDC90 10.81 / MCID 10.83 for DASH (Franchignoni 2014).
  interpretation: 'Franchignoni 2014 (upper limb): ICC 0.91 / 0.93; MDC90 12.85 / 10.81; MCID 15.91 (QuickDASH) and 10.83 (DASH). Erickson 2019 JOSPT CTS CPG: ''should use the CTQ-SSS to assess symptoms and the ... CTQ-FS or the ... DASH questionnaire to assess function''.'
  metrics: ICC 0.91 (QuickDASH) / 0.93 (DASH) · MDC90 12.85 (QuickDASH) / 10.81 (DASH) · MCID 15.91 (QuickDASH) and 10.83 (DASH) (Franchignoni 2014)
  calculator:
    kind: formula
    decimals: 1
    value_label: / 100 QuickDASH Score (0–100, at least 10 items answered)
    expr: '(((q1>0)+(q2>0)+(q3>0)+(q4>0)+(q5>0)+(q6>0)+(q7>0)+(q8>0)+(q9>0)+(q10>0)+(q11>0)) >= 10) ? ((((q1+q2+q3+q4+q5+q6+q7+q8+q9+q10+q11) / ((q1>0)+(q2>0)+(q3>0)+(q4>0)+(q5>0)+(q6>0)+(q7>0)+(q8>0)+(q9>0)+(q10>0)+(q11>0))) - 1) * 25) : NaN'
    inputs:
    - heading: QuickDASH Items (11 items, 1–5 each; answer at least 10 items)
    - key: q1
      label: 1. Open a tight or new jar
      type: select
      options: &id003
      - - '0'
        - — Not answered —
      - - '1'
        - 1 — No difficulty / none
      - - '2'
        - 2 — Mild difficulty / mild
      - - '3'
        - 3 — Moderate difficulty / moderate
      - - '4'
        - 4 — Severe difficulty / severe
      - - '5'
        - 5 — Unable / extreme
    - key: q2
      label: 2. Do heavy household chores
      type: select
      options: *id003
    - key: q3
      label: 3. Carry a shopping bag or briefcase
      type: select
      options: *id003
    - key: q4
      label: 4. Wash your back
      type: select
      options: *id003
    - key: q5
      label: 5. Use a knife to cut food
      type: select
      options: *id003
    - key: q6
      label: 6. Recreational activities with force/impact through arm, shoulder or hand
      type: select
      options: *id003
    - key: q7
      label: 7. Interference with normal social activities during past week
      type: select
      options: *id003
    - key: q8
      label: 8. Limitation in work or regular daily activities during past week
      type: select
      options: *id003
    - key: q9
      label: 9. Arm, shoulder or hand pain
      type: select
      options: *id003
    - key: q10
      label: 10. Tingling (pins and needles) in your arm, shoulder or hand
      type: select
      options: *id003
    - key: q11
      label: 11. Difficulty sleeping because of pain in your arm, shoulder or hand
      type: select
      options: *id003
    outputs:
    - when: v >= 0
      text: 'QuickDASH Score: {v|1} / 100 · Franchignoni 2014 (upper limb): ICC 0.91 / 0.93; MDC90 12.85 (QuickDASH) / 10.81 (DASH); MCID 15.91 (QuickDASH) and 10.83 (DASH)'
      tone: good
