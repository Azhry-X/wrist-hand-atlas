- id: jospt-2019-cts-cpg
  title: JOSPT 2019 Carpal Tunnel Syndrome Clinical Practice Guideline (Erickson et al.)
  page: 4
  type: info
  review_status: approved
  evidence: Guideline
  summary: Verbatim clinical practice guideline recommendations for carpal tunnel syndrome diagnosis, orthoses, education, physical agents, ergonomics, manual therapy, and outcome measures (Erickson 2019 JOSPT CTS CPG).
  steps:
  - 'Diagnosis: ''Clinicians should assess and document patient age (older than 45 years), whether shaking their hands relieves their symptoms, sensory loss in the thumb, the wrist ratio index (greater than 0.67), and scores from the Boston Carpal Tunnel Questionnaire symptom severity scale (CTQ-SSS) (greater than 1.9). The presence of more than 3 of these clinical findings has shown acceptable diagnostic accuracy.'''
  - 'Orthoses & education: ''Clinicians should recommend a neutral-positioned wrist orthosis worn at night for short-term symptom relief and functional improvement''; ''may suggest adjusting wear time to include daytime, symptomatic, or full-time use when night-only use is ineffective''; ''may add patient education on pathology, risk identification, symptom self-management, and postures/activities that aggravate symptoms''; ''should recommend an orthosis for women experiencing CTS during pregnancy''.'
  - 'Physical agents & ergonomics: ''may recommend a trial of superficial heat''; ''may recommend the application of microwave or shortwave diathermy''; ''may offer a trial of interferential current''; ''may perform phonophoresis''; ''should not use low-level laser therapy or other types of nonlaser light therapy''; ''should not use thermal ultrasound''; ''should not use iontophoresis''; ''should not use or recommend the use of magnets''; ''may educate their patients regarding the effects of mouse use on carpal tunnel pressure''; ''may recommend keyboards with reduced strike force''.'
  - 'Manual therapy: ''may perform manual therapy, directed at the cervical spine and upper extremity, for individuals with mild to moderate CTS in the short term''; ''may use a combined orthotic/stretching program in individuals with mild to moderate CTS who do not have thenar atrophy and have normal 2-point discrimination''.'
  - 'Outcome measures: ''should use the CTQ-SSS to assess symptoms and the ... CTQ-FS or the ... DASH questionnaire to assess function''; ''should not use grip strength when assessing short-term (less than 3 months) change ... following CTR surgery''; ''should not use lateral pinch strength as an outcome measure''.'
  positive: Guideline strength is indicated by the CPG's own verb ('should', 'may', 'should not').
  interpretation: Erickson 2019 JOSPT CTS CPG provides evidence-based clinical practice recommendations across diagnosis, non-surgical care, and outcome measurement.
  metrics: Guideline (Erickson 2019 JOSPT CTS CPG — 'should' / 'may' / 'should not')
  sources:
  - text: Erickson 2019 JOSPT CTS CPG
    url: https://doi.org/10.2519/jospt.2019.0301
