- id: cts-corticosteroid-injection
  title: Carpal Tunnel Syndrome — Corticosteroid Injection (Short-, 1-Year & 5-Year Outcomes)
  page: 6
  type: info
  review_status: approved
  evidence: H
  summary: Cochrane review (Marshall 2007) and placebo-controlled methylprednisolone RCT at 10 weeks, 1 year (Atroshi 2013), and 5 years (Hofer 2021) in carpal tunnel syndrome.
  steps:
  - Counsel patients that local corticosteroid injection improves symptom scores at 10 weeks (−0.64 for 80 mg and −0.88 for 40 mg vs placebo), with no difference in symptom score at 1 year (Atroshi 2013) or 5 years (Hofer 2021).
  - Surgery rates within 1 year were 73% (80 mg), 81% (40 mg), and 92% (placebo) (Atroshi 2013).
  - 'Marshall 2007 (Cochrane): steroid injection was no better than anti-inflammatory + splint at 8 weeks or laser at 6 months, and two injections were no better than one.'
  positive: Short-term (10-week) symptom reduction vs placebo; high subsequent 1-year surgery rates (73% / 81% vs 92% placebo) and no symptom-score difference at 1 or 5 years.
  interpretation: 'Marshall 2007 (Cochrane): no better than anti-inflammatory + splint at 8 weeks or laser at 6 months; two injections no better than one. Atroshi 2013 (RCT, n = 111): 10 weeks: symptom score −0.64 (80 mg) and −0.88 (40 mg) vs placebo; no difference at 1 year; surgery within 1 year 73%, 81%, 92% (80 mg, 40 mg, placebo). Hofer 2021 (5 years): symptom-score change vs placebo 0.14 (−0.17 to 0.45) for 80 mg and 0.12 (−0.19 to 0.43) for 40 mg.'
  metrics: 'Atroshi 2013 (n = 111): 10-wk symptom score −0.64 (80 mg), −0.88 (40 mg) vs placebo; 1-yr surgery 73%, 81%, 92% · Hofer 2021 (5-yr): 0.14 (−0.17 to 0.45) for 80 mg, 0.12 (−0.19 to 0.43) for 40 mg · Marshall 2007: 2 injections no better than 1'
