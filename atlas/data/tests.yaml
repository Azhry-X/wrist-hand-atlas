- id: crps-prevention-vitamin-c
  title: CRPS Prevention After Wrist Fracture — Vitamin C & Cast-Complaint Risk
  page: 5
  type: info
  review_status: approved
  evidence: M
  summary: Evidence on vitamin C prophylaxis after wrist fracture (Zollinger 2007 RCT vs Evaniew 2015 meta-analysis) and the prognostic risk of early cast-related complaints.
  steps:
  - Screen every immobilised wrist fracture patient for early cast-related complaints (tightness, burning pain, paraesthesia, pressure), which strongly predicted CRPS in Zollinger 2007 (RR 5.35, 2.13–13.42).
  - 'Weigh conflicting vitamin C evidence: Zollinger 2007 (RCT, 416 pts) found CRPS 2.4% vitamin C vs 10.1% placebo (p = 0.002) and 1.8% with 500 mg (RR 0.17, 0.04–0.77), whereas the Evaniew 2015 meta-analysis (3 RCTs) ''fails to demonstrate a significant benefit''.'
  positive: Early cast-related complaints predicted CRPS (RR 5.35, 2.13–13.42, Zollinger 2007) -> immediate cast check and neurovascular review.
  interpretation: 'Zollinger 2007 (RCT, 416 pts): CRPS 2.4% vitamin C vs 10.1% placebo (p = 0.002); 500 mg: 1.8% (RR 0.17, 0.04–0.77); early cast-related complaints predicted CRPS (RR 5.35, 2.13–13.42). Evaniew 2015 (MA, 3 RCTs): ''fails to demonstrate a significant benefit''.'
  metrics: 'Zollinger 2007 (416 pts): CRPS 2.4% vitamin C vs 10.1% placebo (p = 0.002); 500 mg 1.8% (RR 0.17, 0.04–0.77); cast complaints RR 5.35 (2.13–13.42) · Evaniew 2015 (MA, 3 RCTs): ''fails to demonstrate a significant benefit'''
