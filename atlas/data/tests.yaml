- id: tendon-nerve-gliding-proprioception
  title: Tendon & Nerve Gliding and Wrist Proprioception Progression
  page: 8
  type: info
  review_status: approved
  evidence: E
  summary: Clinical progression of digital flexor/extensor differential tendon gliding, median/ulnar nerve sliders, and wrist sensorimotor/proprioceptive control.
  steps:
  - 'Differential flexor tendon gliding: progress smoothly through straight hand, hook fist (maximises FDP-FDS differential glide), full composite fist, tabletop (intrinsic plus), and straight fist (maximises FDS excursion).'
  - 'Median and ulnar nerve gliding: perform gentle, non-provocative slider sequences (alternating proximal release with distal tension) without triggering sustained paraesthesia.'
  - 'Wrist proprioception and neuromuscular control: progress from joint position sense and dart-thrower''s plane (radial extension to ulnar flexion) control to perturbations, closed-chain weight-bearing, and task-specific occupational/sport loading.'
  positive: Pain-free tendon excursion, reduced neural mechanosensitivity, and restored dynamic carpal stability.
  interpretation: Expert clinical progression (E) tailored to tissue irritability and surgeon-directed post-operative precautions.
  metrics: Expert clinical progression (E)
  sources: []
