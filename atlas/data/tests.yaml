- id: hand-oa-ra-exercise
  title: Hand Osteoarthritis & Rheumatoid Hand Exercise (Cochrane & SARAH Trial)
  page: 8
  type: info
  review_status: approved
  evidence: H
  summary: Cochrane review of exercise for hand osteoarthritis (Østerås 2017) and the SARAH randomised trial of tailored hand exercises for rheumatoid arthritis (Lamb 2015).
  steps:
  - 'For hand osteoarthritis (Østerås 2017 Cochrane, 5 trials, 381 pts): prescribe hand mobility and strengthening exercise to reduce pain SMD −0.27 (−0.47 to −0.07), improve function SMD −0.28 (−0.58 to 0.02), and reduce stiffness SMD −0.36 (−0.58 to −0.15) (low quality).'
  - 'For rheumatoid arthritis of the hand (Lamb 2015 SARAH RCT, n = 490): deliver tailored strengthening and stretching hand exercises alongside standard care, improving MHQ overall hand function by +4·3 (1·5–7·1) at 12 months.'
  positive: 'Hand OA exercise: pain SMD −0.27 and stiffness SMD −0.36, low quality (Østerås 2017); SARAH tailored exercises improve 12-month MHQ function by +4·3 (1·5–7·1) (Lamb 2015).'
  interpretation: 'Østerås 2017 (Cochrane): pain SMD −0.27 (−0.47 to −0.07), 5 trials 381 pts; function SMD −0.28 (−0.58 to 0.02); stiffness SMD −0.36 (−0.58 to −0.15); low quality. Lamb 2015 (SARAH RCT, n = 490): tailored exercises: MHQ function +4·3 (1·5–7·1) at 12 months.'
  metrics: 'Hand OA (Østerås 2017, 5 trials, 381 pts): pain SMD −0.27 (−0.47 to −0.07), function SMD −0.28 (−0.58 to 0.02), stiffness SMD −0.36 (−0.58 to −0.15) · SARAH (Lamb 2015, n = 490): 12-mo MHQ function +4·3 (1·5–7·1)'
