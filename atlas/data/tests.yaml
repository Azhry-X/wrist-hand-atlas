  - 'JOSPT CTS CPG (Erickson 2019): ''Clinicians should recommend a neutral-positioned wrist orthosis worn at night for short-term symptom relief and functional improvement''; ''may suggest adjusting wear time to include daytime, symptomatic, or full-time use when night-only use is ineffective''; ''may add patient education on pathology, risk identification, symptom self-management, and postures/activities that aggravate symptoms''; ''should recommend an orthosis for women experiencing CTS during pregnancy''.'
  - 'Page 2012 (Cochrane): night splint vs no treatment gave overall improvement at 4 weeks RR 3.86 (2.29–6.51), low quality; neutral vs extension splint RR 2.43 (1.12–5.28), very low quality.'
