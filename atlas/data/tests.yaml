- id: bctq
  title: BCTQ (Boston Carpal Tunnel Questionnaire — CTQ-SSS & CTQ-FS)
  page: 4
  type: info
  review_status: approved
  evidence: L
  summary: Condition-specific carpal tunnel outcome measure comprising the Symptom Severity Scale (mean of 11 items, 1–5) and Functional Status Scale (mean of 8 items, 1–5).
  steps:
  - 'Symptom Severity Scale (CTQ-SSS): rate 11 items from 1 (normal / no symptoms) to 5 (very severe) and compute the mean (sum ÷ 11).'
  - 'Functional Status Scale (CTQ-FS): rate 8 hand-function tasks from 1 (no difficulty) to 5 (cannot perform) and compute the mean (sum ÷ 8).'
  - 'JOSPT CTS CPG (Erickson 2019): ''should use the CTQ-SSS to assess symptoms and the ... CTQ-FS or the ... DASH questionnaire to assess function''; CTQ-SSS > 1.9 is one of the 5 diagnostic cluster items.'
  positive: 'Women with CTS (López-de-Uralde-Villanueva 2024): MCID 0.64 for Symptom Severity Scale (CTQ-SSS) and 0.23 for Functional Status Scale (CTQ-FS). Diagnostic cluster threshold: CTQ-SSS > 1.9 (Wainner 2005 / Erickson 2019).'
  interpretation: 'López-de-Uralde-Villanueva 2024 (women with CTS): MCID: NPRS 1.5 (mean) and 2.5 (worst pain); BCTQ 0.23 (functional status) and 0.64 (symptom severity). Erickson 2019 JOSPT CTS CPG: ''should use the CTQ-SSS to assess symptoms and the ... CTQ-FS or the ... DASH questionnaire to assess function''.'
  metrics: 'MCID in women with CTS (López-de-Uralde-Villanueva 2024): BCTQ 0.23 (functional status) and 0.64 (symptom severity) · Diagnostic threshold CTQ-SSS > 1.9 (Wainner 2005 / Erickson 2019)'
  calculator:
