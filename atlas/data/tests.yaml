- id: cts-manual-neural-mobilisation
  title: CTS — Manual Therapy, Desensitisation & Neural / Tendon Mobilisation
  page: 7
  type: info
  review_status: approved
  evidence: H
  summary: Evidence on exercise and mobilisation (Page 2012 Cochrane), neural mobilisation (Basson 2017), manual therapy vs surgery (Fernández-de-las-Peñas 2015), and JOSPT 2019 CPG manual therapy recommendations in CTS.
  steps:
  - 'JOSPT CTS CPG (Erickson 2019): ''may perform manual therapy, directed at the cervical spine and upper extremity, for individuals with mild to moderate CTS in the short term''; ''may use a combined orthotic/stretching program in individuals with mild to moderate CTS who do not have thenar atrophy and have normal 2-point discrimination''.'
  - 'Manual therapy vs surgery (Fernández-de-las-Peñas 2015 RCT, 120 women): physical therapy was better at 1 and 3 months (mean pain −2.0, −2.8 to −1.2, and −1.3, −2.1 to −.6; worst pain −2.9 and −2.0) and similar to surgery at 6 and 12 months.'
  - 'Neural mobilisation (Basson 2017 SR/MA, 40 RCTs): in CTS most clinical outcomes were not improved (P > .11), with some positive neurophysiological effects. Page 2012 (Cochrane, 16 trials): limited, low-quality evidence for exercise and mobilisation; decision should be based on clinician''s expertise and patient preference.'
  positive: 'In women with CTS, physical therapy was better than surgery for pain at 1 and 3 months and similar at 6 and 12 months (Fernández-de-las-Peñas 2015). JOSPT CTS CPG: clinicians "may perform manual therapy, directed at the cervical spine and upper extremity, for individuals with mild to moderate CTS in the short term" (Erickson 2019).'
  interpretation: 'Page 2012 (Cochrane, 16 trials): limited, low-quality evidence; decision should be based on clinician''s expertise and patient preference. Basson 2017 (SR/MA, 40 RCTs): in CTS most clinical outcomes not improved (P > .11), some positive neurophysiological effects. Fernández-de-las-Peñas 2015 (RCT, 120 women): PT better at 1 and 3 months: mean pain −2.0 (−2.8 to −1.2) and −1.3 (−2.1 to −.6); worst pain −2.9 and −2.0; similar at 6 and 12 months. Erickson 2019 JOSPT CTS CPG: clinicians "may perform manual therapy, directed at the cervical spine and upper extremity, for individuals with mild to moderate CTS in the short term"; "may use a combined orthotic/stretching program in individuals with mild to moderate CTS who do not have thenar atrophy and have normal 2-point discrimination".'
  metrics: 'PT vs surgery (Fernández-de-las-Peñas 2015, 120 women): 1- & 3-mo mean pain −2.0 (−2.8 to −1.2) and −1.3 (−2.1 to −.6), worst pain −2.9 and −2.0; similar at 6 & 12 mo · Neural mobilisation (Basson 2017, 40 RCTs): clinical outcomes P > .11 · Page 2012 (16 trials): limited, low-quality evidence'
  sources:
