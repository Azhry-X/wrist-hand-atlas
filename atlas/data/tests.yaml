- id: wartenberg-sign
  title: Wartenberg Sign (Ulnar Nerve — Little Finger Abduction Drift)
  page: 3
  type: test
  review_status: approved
  evidence: E
  summary: Clinical sign of ulnar intrinsic motor weakness characterised by persistent abduction of the fifth digit due to unopposed extensor digiti minimi pull.
