- id: darcy-cts-rational-exam
  title: CTS Rational Clinical Exam — Katz Hand Diagram, Hypalgesia & Thumb Abduction
  page: 4
  type: test
  review_status: approved
  evidence: M
  summary: 'Three highest-value individual physical examination findings from the JAMA Rational Clinical Examination systematic review (D''Arcy 2000): median-territory hypalgesia, Katz hand symptom diagram, and thumb abduction (APB) strength.'
  steps:
  - 'Katz hand diagram: have the patient shade the exact distribution of pain, numbness, and tingling on a hand diagram; classify as classic/probable (palmar thumb, index, middle ± ring) vs unlikely (no palmar involvement of digits 1–3).'
  - 'Median-territory hypalgesia: compare pinprick sensation over the palmar aspect of the index/thumb with the ipsilateral little finger.'
  - 'Thumb abduction strength (abductor pollicis brevis, APB): position the palm supinated and resist palmar abduction of the thumb perpendicular to the plane of the palm.'
  positive: 'For CTS: hypalgesia in median territory LR 3.1 (2.0–5.1), classic / probable Katz hand diagram LR 2.4 (1.6–3.5), weak thumb abduction LR 1.8 (1.4–2.3). Against CTS: unlikely Katz diagram LR 0.2 (0.0–0.7), normal thumb abduction LR 0.5 (0.4–0.7).'
  interpretation: 'D''Arcy 2000 (JAMA SR, 12 studies): best findings: hypalgesia in median territory LR 3.1 (2.0–5.1), classic / probable Katz hand diagram 2.4 (1.6–3.5), weak thumb abduction 1.8 (1.4–2.3); against CTS: unlikely Katz diagram LR 0.2 (0.0–0.7), normal thumb abduction 0.5 (0.4–0.7); Phalen, Tinel, nocturnal paraesthesia, thenar atrophy, 2-point / vibration / monofilament have little or no value.'
  metrics: Hypalgesia LR 3.1 (2.0–5.1) · Classic/probable Katz diagram LR 2.4 (1.6–3.5); unlikely Katz diagram LR 0.2 (0.0–0.7) · Weak thumb abduction LR 1.8 (1.4–2.3); normal thumb abduction LR 0.5 (0.4–0.7) (D'Arcy 2000)
  sources:
  - text: D'Arcy 2000 JAMA
    url: https://doi.org/10.1001/jama.283.23.3110
- id: wainner-cts-cpr
  title: Wainner Carpal Tunnel Syndrome Clinical Prediction Rule (5-Item Cluster)
  page: 4
  type: test
  review_status: approved
  evidence: L
  video_url: https://www.youtube.com/watch?v=h136sLsCZcc
  video_title: 'Physiotutors: Wainner Clinical Prediction Rule (CPR) | Carpal Tunnel Syndrome (CTS)'
  summary: 5-item clinical prediction rule for carpal tunnel syndrome (Wainner 2005; not validated) and JOSPT 2019 CPG diagnostic cluster.
  steps:
  - 1. Ask whether shaking hands relieves symptoms (Flick sign).
  - 2. Measure anteroposterior wrist depth divided by mediolateral wrist width at the distal wrist crease to check if wrist-ratio index > .67.
  - 3. Score the Boston Carpal Tunnel Questionnaire Symptom Severity Scale (CTQ-SSS) to check if > 1.9.
  - 4. Test pinprick sensation on the thumb (digit 1) compared with the little finger for reduced median sensory field of digit 1.
  - 5. Document whether patient age > 45 years.
  positive: All 5 items positive -> LR 18.3 (not validated); post-test probability changes up to 56% (Wainner 2005). Presence of more than 3 of 5 findings has shown acceptable diagnostic accuracy (Erickson 2019 JOSPT CTS CPG).
  interpretation: 'Wainner 2005: 5 items: shaking hands relieves symptoms, wrist-ratio index > .67, Symptom Severity Scale > 1.9, reduced median sensory field of digit 1, age > 45; LR 18.3 when all 5 positive; post-test probability changes up to 56% (not validated). Erickson 2019 JOSPT CTS CPG: ''Clinicians should assess and document patient age (older than 45 years), whether shaking their hands relieves their symptoms, sensory loss in the thumb, the wrist ratio index (greater than 0.67), and scores from the Boston Carpal Tunnel Questionnaire symptom severity scale (CTQ-SSS) (greater than 1.9). The presence of more than 3 of these clinical findings has shown acceptable diagnostic accuracy.'''
  metrics: '5 items positive: LR 18.3; post-test probability changes up to 56% (Wainner 2005, not validated) · > 3 of 5 findings: acceptable diagnostic accuracy (Erickson 2019 JOSPT CTS CPG)'
  calculator:
    kind: formula
    decimals: 0
    value_label: / 5 Wainner CTS cluster items positive
    expr: c1 + c2 + c3 + c4 + c5
    inputs:
    - heading: Wainner 2005 CTS Cluster (5 checkboxes — tick all positive findings)
    - key: c1
      label: 1. Shaking hands relieves symptoms
      type: check
    - key: c2
      label: 2. Wrist-ratio index > 0.67 (AP depth ÷ ML width at distal wrist crease)
      type: check
    - key: c3
      label: 3. Boston Carpal Tunnel Questionnaire Symptom Severity Scale (CTQ-SSS) > 1.9
      type: check
    - key: c4
      label: 4. Reduced median sensory field of digit 1 (sensory loss in the thumb)
      type: check
    - key: c5
      label: 5. Age > 45 years
      type: check
    outputs:
    - when: v === 5
      text: LR 18.3 (not validated)
      tone: bad
    - when: v < 5
      text: 'fewer than 5 positive — see JOSPT CPG (more than 3 of 5: acceptable accuracy)'
      tone: warn
  sources:
  - text: Wainner 2005 Arch Phys Med Rehabil
    url: https://doi.org/10.1016/j.apmr.2004.11.008
  - text: Erickson 2019 JOSPT CTS CPG
    url: https://doi.org/10.2519/jospt.2019.0301
